# Selecting this config changes the device mode and enables motor control.
# Pilot gains are READ ONLY. Physical response must be tested by the operator.
# command_timeout_sec marks publisher idle: keep the session, re-acquire on resume.
/sharpa/left_hand/hand_node:
  ros__parameters:
    side: left
    backend: sharpa_sdk
    serial_number: "CD52943BCD53"
    control_mode: mit
    tactile_enabled: true
    tactile_publish_rate_hz: 30.0
    speed_coeff: 0.3
    current_coeff: 0.6
    interpolation: false
    publish_rate_hz: 100.0
    command_timeout_sec: 0.5
    sdk_discovery_timeout_sec: 10.0
    mit_start_tolerance_rad: 0.1
    joint_limit_tolerance_deg: 0.5
    recovery_worsening_deg: 0.5
    recovery_worsening_sec: 0.2
    recovery_client_timeout_sec: 0.5
/sharpa/right_hand/hand_node:
  ros__parameters:
    side: right
    backend: sharpa_sdk
    serial_number: "C956943BC957"
    control_mode: mit
    tactile_enabled: true
    tactile_publish_rate_hz: 30.0
    speed_coeff: 0.3
    current_coeff: 0.6
    interpolation: false
    publish_rate_hz: 100.0
    command_timeout_sec: 0.5
    sdk_discovery_timeout_sec: 10.0
    mit_start_tolerance_rad: 0.1
    joint_limit_tolerance_deg: 0.5
    recovery_worsening_deg: 0.5
    recovery_worsening_sec: 0.2
    recovery_client_timeout_sec: 0.5
